<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولّد مفاتيح الترخيص - محول الرصيد السوري</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        .badge {
            display: inline-block;
            background: #e11d48;
            color: white;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        h2 {
            margin: 0 0 8px 0;
            color: #f8fafc;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #e11d48;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #e11d48;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .result-box {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #0f172a;
            border-radius: 14px;
            border: 2px dashed #e11d48;
            text-align: center;
        }
        .key-display {
            font-family: monospace;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #38bdf8;
            margin: 12px 0;
            word-break: break-all;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-secondary {
            background: #334155;
            font-size: 13px;
            padding: 10px;
        }
        .copied-toast {
            color: #4ade80;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">أداة المطور الخاصة</span>
        <h2>مولّد أكواد التفعيل</h2>
        <p class="subtitle">قم بتوليد كود التفعيل المرخص لجهاز الزبون دون الحاجة لفتح التطبيق، يعمل بدون إنترنت.</p>

        <label for="deviceId">معرّف جهاز الزبون (Device ID):</label>
        <input type="text" id="deviceId" placeholder="مثال: SYR-7B4F-82C1" required>

        <label for="clientName">اسم الزبون أو المتجر المرخص له:</label>
        <input type="text" id="clientName" placeholder="مثال: تسجيلات السلام - دمشق" required>

        <button onclick="generateKey()">توليد كود التفعيل المرتبط بالجهاز</button>

        <div id="resultBox" class="result-box">
            <span style="font-size: 13px; color: #94a3b8;">كود التفعيل الحصري لهذا الجهاز فقط:</span>
            <div id="keyDisplay" class="key-display"></div>
            
            <div class="action-btns">
                <button class="btn-secondary" onclick="copyKey()">نسخ الكود</button>
                <button class="btn-secondary" onclick="shareWhatsApp()">إرسال واتساب</button>
            </div>
            <div id="copiedToast" class="copied-toast">تم نسخ الكود للحافظة!</div>
        </div>

        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #334155; text-align: center; font-size: 13px; color: #94a3b8;">
            <span>البريد الإلكتروني المعتمد للدعم والتراخيص:</span><br>
            <a href="mailto:starsyria2500@gmail.com" style="color: #38bdf8; text-decoration: none; font-weight: bold; margin-top: 4px; display: inline-block;">starsyria2500@gmail.com</a>
        </div>
    </div>

    <script>
        // Salt used in the app:
        const MASTER_SALT = "SYR_SECURE_V2_2026";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function generateKey() {
            const deviceId = document.getElementById('deviceId').value.trim().toUpperCase();
            const clientName = document.getElementById('clientName').value.trim().toLowerCase();

            if (!deviceId || !clientName) {
                alert('يرجى إدخال معرّف الجهاز واسم الزبون');
                return;
            }

            const payload = `${deviceId}|${clientName}|${MASTER_SALT}`;
            const fullHash = await sha256(payload);
            const part1 = fullHash.substring(0, 4).toUpperCase();
            const part2 = fullHash.substring(4, 8).toUpperCase();
            const licenseKey = `ACT-${part1}-${part2}`;

            document.getElementById('keyDisplay').innerText = licenseKey;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyKey() {
            const key = document.getElementById('keyDisplay').innerText;
            navigator.clipboard.writeText(key);
            const toast = document.getElementById('copiedToast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function shareWhatsApp() {
            const key = document.getElementById('keyDisplay').innerText;
            const deviceId = document.getElementById('deviceId').value.trim();
            const clientName = document.getElementById('clientName').value.trim();
            const msg = `أهلاً بك، كود تفعيل تطبيق محول الرصيد السوري المخصص لجهازك (${deviceId}) باسم (${clientName}):\n*${key}*\nيرجى نسخه ولصقه في شاشة تفعيل التطبيق.`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
